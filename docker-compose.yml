version: '3.8'

services:
  # SimpleVault Landing v1 - Main Application
  simplevault-landing:
    build:
      context: .
      dockerfile: packages/simplevault-landing-v1/Dockerfile
    container_name: simplevault-landing-v1
    ports:
      - "${SIMPLEVAULT_PORT:-3000}:80"
    environment:
      - VITE_NETWORK=${VITE_NETWORK:-cronos-testnet}
      - VITE_RPC_URL=${VITE_RPC_URL:-https://evm-t3.cronos.org}
      - VITE_CONTRACT_ADDRESS=${VITE_CONTRACT_ADDRESS:-0x656a4D09f53ab82f6B291082cb3159F7c14424dE}
      - VITE_CONTRACT_NETWORK=${VITE_CONTRACT_NETWORK:-cronos-testnet}
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-INFO}
      - VITE_APP_NAME=${VITE_APP_NAME:-SimpleVault Landing}
      - VITE_APP_ENV=${VITE_APP_ENV:-production}
      - VITE_APP_VERSION=${VITE_APP_VERSION:-1.0.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.cronos.app=simplevault-landing"
      - "com.cronos.version=1.0.0"

  # UI Demo - Example Application
  ui-demo:
    build:
      context: .
      dockerfile: packages/examples/ui-demo/Dockerfile
    container_name: cronos-ui-demo
    ports:
      - "${UI_DEMO_PORT:-3001}:80"
    environment:
      - VITE_CRONOS_RPC_URL=${VITE_RPC_URL:-https://evm-t3.cronos.org}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.cronos.app=ui-demo"

  # Commercial Demo - DeFi Dashboard
  commercial-demo:
    build:
      context: .
      dockerfile: packages/examples02/defi-dashboard/Dockerfile
    container_name: cronos-commercial-demo
    ports:
      - "${COMMERCIAL_DEMO_PORT:-3002}:80"
    environment:
      - VITE_CRONOS_RPC_URL=${VITE_RPC_URL:-https://evm-t3.cronos.org}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.cronos.app=commercial-demo"

networks:
  default:
    name: cronos-network
    driver: bridge
