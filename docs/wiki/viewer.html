<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronos AI Agent SDK - Documentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 100%;
            margin: 0;
            background: white;
        }

        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 200px;
            background: #f8f9fa;
            border-right: 1px solid #e2e8f0;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            background: white;
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 2rem;
        }

        .file-selector {
            margin-bottom: 1rem;
            padding: 0;
            background: none;
            border: none;
        }

        .file-grid {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .file-button {
            background: none;
            border: none;
            padding: 0.3rem 0;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            color: #4a5568;
            font-size: 0.85rem;
            border-bottom: 1px solid transparent;
        }

        .file-button:hover {
            color: #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .file-button.active {
            color: #667eea;
            font-weight: 600;
            border-bottom-color: #667eea;
        }

        .file-button p {
            display: none;
        }

        .markdown-content {
            background: white;
            padding: 2rem;
            min-height: 100%;
        }

        .markdown-content h1 {
            color: #2d3748;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            border-bottom: 3px solid #667eea;
            padding-bottom: 0.5rem;
        }

        .markdown-content h2 {
            color: #2d3748;
            font-size: 2rem;
            margin: 2rem 0 1rem 0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }

        .markdown-content h3 {
            color: #4a5568;
            font-size: 1.5rem;
            margin: 1.5rem 0 1rem 0;
        }

        .markdown-content h4 {
            color: #4a5568;
            font-size: 1.2rem;
            margin: 1rem 0 0.5rem 0;
        }

        .markdown-content p {
            margin-bottom: 1rem;
            line-height: 1.7;
            color: #4a5568;
        }

        .markdown-content ul, .markdown-content ol {
            margin: 1rem 0 1rem 2rem;
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
            color: #4a5568;
        }

        .markdown-content pre {
            background: #2d3748;
            color: #e2e8f0;
            padding: 1.5rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
            font-family: 'Fira Code', 'Consolas', monospace;
            white-space: pre;
            font-size: 0.9rem;
        }

        .markdown-content code {
            background: #f1f5f9;
            color: #334155;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 0.9rem;
        }

        .markdown-content pre code {
            background: none;
            color: inherit;
            padding: 0;
        }

        .markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
            font-size: 0.9rem;
        }

        .markdown-content table td {
            border: 1px solid #e2e8f0;
            padding: 0.5rem;
            text-align: left;
        }

        .markdown-content table tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .back-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="index.html" class="back-button" style="position: absolute; left: 2rem; top: 50%; transform: translateY(-50%); margin: 0;">← Back to Wiki</a>
            <h1>📚 Cronos AI Agent SDK Documentation</h1>
            <p>Easy-to-read documentation viewer</p>
        </div>
        
        <div class="content">
            <div class="sidebar">
                <div class="file-grid" id="fileGrid"></div>
            </div>
            
            <div class="main-content">
                <div class="markdown-content" id="markdownContent">
                    <div style="text-align: center; padding: 3rem; color: #666;">
                        Select a documentation file to view its contents
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const files = [
            { name: 'README.md', title: 'Main README', description: 'SDK overview and quick start' },
            { name: 'QUICK_START.md', title: 'Quick Start', description: 'Fast-track setup guide' },
            { name: 'QUICKGUIDE.md', title: 'Quick Guide', description: 'Condensed reference' },
            { name: 'ARCHITECTURE_GUIDE.md', title: 'Architecture', description: 'System design patterns' },
            { name: 'INSTALL_GUIDE.md', title: 'Installation', description: 'Setup instructions' },
            { name: 'SETUP_GUIDE.md', title: 'Setup Guide', description: 'Configuration guide' },
            { name: 'BUILD_AND_RUN.md', title: 'Build & Run', description: 'Build instructions' },
            { name: 'AGENTS_SDK.md', title: 'Agents SDK', description: 'Agent system docs' },
            { name: 'AGENTS_FEATURES.md', title: 'Agent Features', description: 'Feature capabilities' },
            { name: 'CUSTOM_AGENT_TYPES.md', title: 'Custom Agents', description: 'Create custom agents' },
            { name: 'UI_IMPLEMENTATION_GUIDE.md', title: 'UI Guide', description: 'React component integration' },
            { name: 'X402_README.md', title: 'Payment System', description: 'HTTP 402 implementation' },
            { name: 'X402_TESTING_README.md', title: 'Payment Testing', description: 'x402 test framework' },
            { name: 'SYSTEM_STATUS.md', title: 'System Status', description: 'Current system health' },
            { name: 'HOW_IT_WORKS.md', title: 'How It Works', description: 'System operations' },
            { name: 'HOW_IT_WORKS_SIMPLE.md', title: 'How It Works (Simple)', description: 'Simplified explanation' },
            { name: 'AI_HANDOFF.md', title: 'AI Handoff', description: 'AI integration guide' },
            { name: 'BUILD_TEST_STEPS.md', title: 'Build Test Steps', description: 'Testing procedures' },
            { name: 'TESTING_Guide.md', title: 'Testing Guide', description: 'Complete testing docs' },
            { name: 'TESTING_WIKI.md', title: 'Testing Wiki', description: 'Testing knowledge base' },
            { name: 'TEST_RESULTS.md', title: 'Test Results', description: 'Latest test outcomes' },
            { name: 'TEST_RESULTS_SUMMARY.md', title: 'Test Summary', description: 'Test results overview' },
            { name: 'UI_COMPONENT_GUIDE.md', title: 'UI Components', description: 'Component documentation' },
            { name: 'UI_BUILDING_COMPONENT_GUIDE.md', title: 'UI Building', description: 'Component building guide' },
            { name: 'UI_TESTING_GUIDE.md', title: 'UI Testing', description: 'UI testing procedures' },
            { name: 'UIDifferences.md', title: 'UI Differences', description: 'UI implementation differences' },
            { name: 'USER_STORIES.md', title: 'User Stories', description: 'Feature requirements' },
            { name: 'WORKS_NOW.md', title: 'Works Now', description: 'Current functionality' },
            { name: 'PolicyGuide.md', title: 'Policy Guide', description: 'Policy configuration' },
            { name: 'GeniusActAgent.md', title: 'Genius Act Agent', description: 'Advanced agent type' },
            { name: 'BOLT_INTEGRATION_PROMPT.md', title: 'Bolt Integration', description: 'Bolt.new integration' },
            { name: 'KEY_DIFF_EXAMPLESvsUIdirectory.md', title: 'Examples vs UI', description: 'Directory differences' },
            { name: 'possdomainnames.md', title: 'Domain Names', description: 'Possible domain names' }
        ];

        async function loadFileContent(filename) {
            try {
                const response = await fetch(`../../${filename}`);
                if (response.ok) {
                    return await response.text();
                }
            } catch (error) {
                console.warn(`Could not load ${filename}:`, error);
            }
            return `# ${filename}\n\nFile not found or could not be loaded.`;
        }

        function parseMarkdown(text) {
            // First, protect code blocks from other replacements
            const codeBlocks = [];
            text = text.replace(/```[\s\S]*?```/g, (match) => {
                const placeholder = `__CODE_BLOCK_${codeBlocks.length}__`;
                codeBlocks.push(match);
                return placeholder;
            });
            
            // Apply markdown transformations
            text = text
                .replace(/^### (.*)/gm, '<h3>$1</h3>')
                .replace(/^## (.*)/gm, '<h2>$1</h2>')
                .replace(/^# (.*)/gm, '<h1>$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/^- (.*)/gm, '<li>$1</li>')
                .replace(/((<li>.*<\/li>\s*)+)/g, '<ul>$1</ul>')
                .replace(/\|(.+)\|/g, (match, content) => {
                    const cells = content.split('|').map(cell => cell.trim());
                    if (cells.every(cell => cell.match(/^[-:]+$/))) {
                        return ''; // Skip separator rows
                    }
                    const cellTags = cells.map(cell => `<td>${cell}</td>`).join('');
                    return `<tr>${cellTags}</tr>`;
                })
                .replace(/(<tr>.*<\/tr>\s*)+/g, '<table border="1" style="border-collapse: collapse; width: 100%; margin: 1rem 0;">$&</table>')
                .split('\n\n')
                .map(para => para.trim())
                .filter(para => para)
                .map(para => para.startsWith('<') ? para : `<p>${para}</p>`)
                .join('');
            
            // Restore code blocks with proper formatting
            codeBlocks.forEach((block, i) => {
                const code = block.replace(/```\w*\n?/, '').replace(/```$/, '');
                const formatted = `<pre><code>${code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;
                text = text.replace(`__CODE_BLOCK_${i}__`, formatted);
            });
            
            return text;
        }

        async function loadFile(filename, button) {
            document.querySelectorAll('.file-button').forEach(b => b.classList.remove('active'));
            button.classList.add('active');
            
            const contentDiv = document.getElementById('markdownContent');
            contentDiv.innerHTML = '<div style="text-align: center; padding: 3rem; color: #666;">Loading...</div>';
            
            const content = await loadFileContent(filename);
            contentDiv.innerHTML = parseMarkdown(content);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('fileGrid');
            
            files.forEach(file => {
                const button = document.createElement('div');
                button.className = 'file-button';
                button.textContent = file.title;
                button.onclick = () => loadFile(file.name, button);
                grid.appendChild(button);
            });

            const urlFile = new URLSearchParams(window.location.search).get('file');
            if (urlFile) {
                const button = Array.from(document.querySelectorAll('.file-button'))
                    .find(b => b.innerHTML.includes(urlFile.replace('.md', '')));
                if (button) {
                    setTimeout(() => button.click(), 100);
                }
            }
        });
    </script>
</body>
</html>
